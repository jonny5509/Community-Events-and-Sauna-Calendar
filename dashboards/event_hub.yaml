title: Event Hub
views:
  - title: Events
    path: event-hub
    icon: mdi:calendar-star
    cards:
      - type: markdown
        title: Community Events Calendar
        content: >
          Browse the calendars below. Use the action controls to show event
          information and map directions in a persistent notification. Links
          are only shown when the source provides them.
      - type: entities
        title: Event Hub controls
        show_header_toggle: false
        entities:
            name: Next event information
            name: Next event directions
      - type: entities
        title: Calendar status
        show_header_toggle: false
        entities:
          - entity: sensor.monthly_events
            name: Monthly Events
          - entity: sensor.lgbtq_events
            name: LGBTQ+ Events
          - entity: sensor.kink_fetish_events
            name: Kink & Fetish Events
      - type: entities
        title: Event overview
        show_header_toggle: false
        entities:
          - entity: sensor.next_lgbtq_event
            name: Next LGBTQ+ event
          - entity: sensor.ongoing_month_event
            name: Ongoing monthly event
          - entity: sensor.next_month_event
            name: Next month's event
          - entity: sensor.past_lgbtq_event
            name: Most recent past LGBTQ+ event
      - type: entities
        title: LGBTQ+ category highlights
        show_header_toggle: false
        entities:
          - entity: sensor.next_gay_event
            name: Next gay event
          - entity: sensor.next_lesbian_event
            name: Next lesbian event
          - entity: sensor.next_bisexual_event
            name: Next bisexual event
          - entity: sensor.next_transgender_event
            name: Next transgender event
          - entity: sensor.next_queer_event
            name: Next queer event
      - type: calendar
        title: Monthly and LGBTQ+ events
        initial_view: listWeek
        entities:
          - calendar.monthly_events
          - calendar.lgbtq_events
      - type: calendar
        initial_view: listWeek
        entities:
      - type: calendar
        title: Kink & Fetish events
        initial_view: listWeek
        entities:
          - calendar.kink_fetish_events

