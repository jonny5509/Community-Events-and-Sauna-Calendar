name: HACS and Home Assistant validation

on:
  push:
    branches: [main, "release/**", "fix/**", "chore/**"]
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HACS integration repository
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Home Assistant integration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master
