name: Tests

on:
  push:
    branches: [main, "release/**", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: Unit and regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-asyncio pytest-homeassistant-custom-component homeassistant
      - name: Run unit and regression tests
        run: python -m pytest -q --ignore=tests/test_integration_lifecycle.py

  home-assistant-integration:
    name: Home Assistant config-entry lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Home Assistant integration test dependencies
        run: python -m pip install --upgrade pip pytest pytest-asyncio pytest-homeassistant-custom-component
      - name: Test config-entry setup, entity creation, and unload
        run: python -m pytest -q tests/test_integration_lifecycle.py
