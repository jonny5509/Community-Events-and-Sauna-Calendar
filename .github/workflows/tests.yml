name: Tests

on:
  push:
    branches: [main, "release/**", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-asyncio homeassistant
      - name: Run tests
        run: python -m pytest -q
